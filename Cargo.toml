[package]
name = "bevy_rogue_sandbox"
version = "0.1.5"
edition = "2024"

[dependencies]
bevy = { version = "0.20.0", default-features = true }
nexus3d = { version = "0.7.0" }
ferromorphic = "0.23.2"
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
rand = "0.8"

[features]
default = ["dev"]
dev = ["bevy/dynamic_linking"]

# High optimization for dependencies in dev builds to sustain 60+ FPS physics & SNNs
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
